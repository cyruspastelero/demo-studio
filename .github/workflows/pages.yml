name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'docs/img/**', 'app/**', 'examples/todo-sample/**', 'look-templates/**', 'motion-templates/**', 'scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (thumbnails for the live editor)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build the live editor (records the todo sample, then a server-less build)
        run: npm run build -w app && npm run build:static -w app
      - name: Download the sample videos from the samples release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download samples --repo "$GITHUB_REPOSITORY" --pattern 'sample-*.mp4' --dir "$RUNNER_TEMP/media"
      - name: Build the site
        run: bash scripts/build-site.sh _site "$RUNNER_TEMP/media"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
