name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - name: Python unit tests
        run: |
          python3 -I tests/test_check.py
          python3 -I tests/test_narrate.py
          python3 -I tests/test_paths.py
          python3 -I tests/test_keynote.py
          python3 -I tests/test_motion.py
          python3 -I tests/test_templates.py
          python3 -I tests/test_security.py
      - name: Node unit tests (title card inputs, frame receiver, scene helpers)
        run: |
          node tests/test_card_safety.mjs
          node tests/test_frame_receiver.mjs
          node tests/test_lib.mjs
          node tests/test_security.mjs
      - name: Smoke test on synthetic footage (includes the quality-bar checklist on a rendered cut)
        run: bash tests/smoke.sh
      - name: Look templates smoke test (house template matches the default look)
        run: bash tests/smoke-templates.sh

  editor:
    name: Local editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:app
      - run: npm run build -w app
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Browser tests (home screen and editor, headless Chrome)
        run: npm run test:e2e
