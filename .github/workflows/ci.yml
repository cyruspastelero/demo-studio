name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - name: Python unit tests
        run: |
          python3 -I tests/test_check.py
          python3 -I tests/test_cardboard_timeline.py
          python3 -I tests/test_narrate.py
          python3 -I tests/test_paths.py
      - name: Node unit tests (title card inputs, frame receiver)
        run: |
          node tests/test_card_safety.mjs
          node tests/test_frame_receiver.mjs
      - name: Smoke test on synthetic footage
        run: bash tests/smoke.sh

  editor:
    name: Local editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:app
      - run: npm run build -w app
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Browser tests (home screen and editor, headless Chrome)
        run: npm run test:e2e
