name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'docs/img/**', 'app/**', 'examples/todo-sample/**', 'look-templates/**', 'motion-templates/**', 'scripts/build-site.sh', '.github/workflows/site.yml']
  workflow_dispatch:

# Builds the homepage (served from Vercel at https://demo-studio.pastelero.ph) and keeps it as an
# artifact named "site". Deploy it with the steps in docs/development.md.
permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (thumbnails for the live editor)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build the live editor (records the todo sample, then a server-less build)
        run: npm run build -w app && npm run build:static -w app
      - name: Download the sample videos from the samples release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download samples --repo "$GITHUB_REPOSITORY" --pattern 'sample-*.mp4' --dir "$RUNNER_TEMP/media"
      - name: Build the site
        run: bash scripts/build-site.sh _site "$RUNNER_TEMP/media"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: _site
          retention-days: 30
